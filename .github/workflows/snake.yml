name: Refresh profile activity

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render the contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#e4002b&color_dots=#0e0e0e,#3a0a14,#9e0020,#e4002b,#ff2b50

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chronicle:
    name: Commit log panel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the commit log panel from live data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python -I tools/chronicle.py assets/chronicle-panel.svg

      - name: Commit it only when the numbers moved
        run: |
          if [ -n "$(git status --porcelain assets/chronicle-panel.svg)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/chronicle-panel.svg
            git commit -m "Refresh commit log panel"
            git push
          else
            echo "No change in the commit log panel."
          fi
