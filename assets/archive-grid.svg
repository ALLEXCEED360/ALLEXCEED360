    <text class="sn" x="58" y="108" font-size="12.5" fill="#ece9e4" fill-opacity=".62">A temporal knowledge graph of</text>
    <text class="sn" x="58" y="126" font-size="12.5" fill="#ece9e4" fill-opacity=".62">the Attack on Titan manga.</text>
    <text class="mn" x="58" y="148" font-size="9" letter-spacing="1.8" fill="#ff2b50">TYPESCRIPT</text>
  </g>
