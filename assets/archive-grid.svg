<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 342" width="1200" height="342" role="img" aria-label="The archive: AOT Paths, a temporal knowledge graph of the Attack on Titan manga, TypeScript. YOLOv8 Vision, real-time object detection from a webcam, Python and OpenCV. Gesture Paint, drawing in the air with your hands, Python and MediaPipe. Invisibility Cloak, real-time colour masking, Python and OpenCV. Daily Reports, automated lottery, shift and sales reporting, Python and Excel. UE5 Plugins, Blueprint HTTP nodes and a weighted character spawner, C++ and Unreal 5. Sentiment Chatbot, reads the mood of a conversation live, React and Flask. Dual-Hero Site, a portfolio switching between two comic-book identities, React and Tailwind.">
  <defs><linearGradient id="gd" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#0e0e0e"/><stop offset="1" stop-color="#050505"/></linearGradient><linearGradient id="rd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9e0020"/><stop offset="1" stop-color="#e4002b"/></linearGradient><pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><circle cx="2" cy="2" r="1.5" fill="#e4002b" fill-opacity=".30"/></pattern></defs>
  <style>
    .disp{font-family:Impact,Haettenschweiler,"Franklin Gothic Heavy","Arial Narrow Bold","Arial Black",sans-serif;font-weight:400}
    .hv{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900}
    .sn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mn{font-family:ui-monospace,"IBM Plex Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .rise{animation:rise .85s cubic-bezier(.16,1,.3,1) both}
    .slam{animation:slam .55s cubic-bezier(.2,1.3,.3,1) both}
    .cut{animation:cut .6s cubic-bezier(.2,.9,.1,1) both}
    .d1{animation-delay:.04s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}.d4{animation-delay:.3s}
    .d5{animation-delay:.4s}.d6{animation-delay:.5s}.d7{animation-delay:.6s}.d8{animation-delay:.7s}
    .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.3s cubic-bezier(.65,0,.35,1) .25s forwards}
    .flick{animation:flick 5s steps(1,end) infinite}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes slam{from{opacity:0;transform:translate(-34px,0) scale(1.06)}to{opacity:1;transform:none}}
    @keyframes cut{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes flick{0%,92%,96%{opacity:1}94%,98%{opacity:.45}}
    @media (prefers-reduced-motion:reduce){
      .rise,.slam,.cut,.flick{animation:none}
      .draw{animation:none;stroke-dashoffset:0}
    }
  </style>
  <rect width="1200" height="342" fill="url(#gd)"/>
  <rect width="1200" height="342" fill="url(#ht)" opacity=".5"/>
  <polygon points="24,0 1200,0 1200,318 1176,342 0,342 0,24" fill="#0e0e0e" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5"/>
  <polygon points="2,30 14,22 14,320 2,330" fill="#e4002b"/>
  <g class="rise d1">
    <polygon points="52,40 308,40 296,162 40,162" fill="#171717" stroke="#ffffff" stroke-opacity=".16"/>
    <polygon points="52,40 84,40 78,45 46,45" fill="#e4002b"/>
    <g transform="translate(0,82) skewX(-7) translate(0,-82)"><text class="disp" font-size="22" textLength="82.08" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="60" y="84" fill="#e4002b">AOT PATHS</text><text class="disp" font-size="22" textLength="82.08" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="58" y="82" fill="#ffffff" stroke="#050505" stroke-width="4" stroke-linejoin="round" paint-order="stroke">AOT PATHS</text></g>
    <text class="sn" x="58" y="108" font-size="12.5" fill="#ece9e4" fill-opacity=".62">A temporal knowledge graph of</text>
    <text class="sn" x="58" y="126" font-size="12.5" fill="#ece9e4" fill-opacity=".62">the Attack on Titan manga.</text>
    <text class="mn" x="58" y="148" font-size="9" letter-spacing="1.8" fill="#ff2b50">TYPESCRIPT</text>
  </g>
  <g class="rise d2">
    <polygon points="336,40 592,40 580,162 324,162" fill="#171717" stroke="#ffffff" stroke-opacity=".16"/>
    <polygon points="336,40 368,40 362,45 330,45" fill="#e4002b"/>
    <g transform="translate(0,82) skewX(-7) translate(0,-82)"><text class="disp" font-size="22" textLength="118.56" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="344" y="84" fill="#e4002b">YOLOV8 VISION</text><text class="disp" font-size="22" textLength="118.56" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="342" y="82" fill="#ffffff" stroke="#050505" stroke-width="4" stroke-linejoin="round" paint-order="stroke">YOLOV8 VISION</text></g>
    <text class="sn" x="342" y="108" font-size="12.5" fill="#ece9e4" fill-opacity=".62">Turns a webcam into a real-time</text>
    <text class="sn" x="342" y="126" font-size="12.5" fill="#ece9e4" fill-opacity=".62">object detection system.</text>
    <text class="mn" x="342" y="148" font-size="9" letter-spacing="1.8" fill="#ff2b50">PYTHON / OPENCV</text>
  </g>
  <g class="rise d3">
    <polygon points="620,40 876,40 864,162 608,162" fill="#171717" stroke="#ffffff" stroke-opacity=".16"/>
    <polygon points="620,40 652,40 646,45 614,45" fill="#e4002b"/>
    <g transform="translate(0,82) skewX(-7) translate(0,-82)"><text class="disp" font-size="22" textLength="118.56" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="628" y="84" fill="#e4002b">GESTURE PAINT</text><text class="disp" font-size="22" textLength="118.56" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="626" y="82" fill="#ffffff" stroke="#050505" stroke-width="4" stroke-linejoin="round" paint-order="stroke">GESTURE PAINT</text></g>
    <text class="sn" x="626" y="108" font-size="12.5" fill="#ece9e4" fill-opacity=".62">Draw, hover and erase in the air</text>
    <text class="sn" x="626" y="126" font-size="12.5" fill="#ece9e4" fill-opacity=".62">with nothing but your hands.</text>
    <text class="mn" x="626" y="148" font-size="9" letter-spacing="1.8" fill="#ff2b50">PYTHON / MEDIAPIPE</text>
  </g>
  <g class="rise d4">
    <polygon points="904,40 1160,40 1148,162 892,162" fill="#171717" stroke="#ffffff" stroke-opacity=".16"/>
    <polygon points="904,40 936,40 930,45 898,45" fill="#e4002b"/>
    <g transform="translate(0,82) skewX(-7) translate(0,-82)"><text class="disp" font-size="22" textLength="164.16" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="912" y="84" fill="#e4002b">INVISIBILITY CLOAK</text><text class="disp" font-size="22" textLength="164.16" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="910" y="82" fill="#ffffff" stroke="#050505" stroke-width="4" stroke-linejoin="round" paint-order="stroke">INVISIBILITY CLOAK</text></g>
    <text class="sn" x="910" y="108" font-size="12.5" fill="#ece9e4" fill-opacity=".62">Real-time colour masking that</text>
    <text class="sn" x="910" y="126" font-size="12.5" fill="#ece9e4" fill-opacity=".62">makes you vanish on camera.</text>
    <text class="mn" x="910" y="148" font-size="9" letter-spacing="1.8" fill="#ff2b50">PYTHON / OPENCV</text>
  </g>
  <g class="rise d3">
    <polygon points="52,178 308,178 296,300 40,300" fill="#171717" stroke="#ffffff" stroke-opacity=".16"/>
    <polygon points="52,178 84,178 78,183 46,183" fill="#e4002b"/>
    <g transform="translate(0,220) skewX(-7) translate(0,-220)"><text class="disp" font-size="22" textLength="118.56" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="60" y="222" fill="#e4002b">DAILY REPORTS</text><text class="disp" font-size="22" textLength="118.56" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="58" y="220" fill="#ffffff" stroke="#050505" stroke-width="4" stroke-linejoin="round" paint-order="stroke">DAILY REPORTS</text></g>
    <text class="sn" x="58" y="246" font-size="12.5" fill="#ece9e4" fill-opacity=".62">Automates lottery, shift and sales</text>
    <text class="sn" x="58" y="264" font-size="12.5" fill="#ece9e4" fill-opacity=".62">reporting for real-world ops.</text>
    <text class="mn" x="58" y="286" font-size="9" letter-spacing="1.8" fill="#ff2b50">PYTHON / EXCEL</text>
  </g>
  <g class="rise d4">
    <polygon points="336,178 592,178 580,300 324,300" fill="#171717" stroke="#ffffff" stroke-opacity=".16"/>
    <polygon points="336,178 368,178 362,183 330,183" fill="#e4002b"/>
    <g transform="translate(0,220) skewX(-7) translate(0,-220)"><text class="disp" font-size="22" textLength="100.32" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="344" y="222" fill="#e4002b">UE5 PLUGINS</text><text class="disp" font-size="22" textLength="100.32" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="342" y="220" fill="#ffffff" stroke="#050505" stroke-width="4" stroke-linejoin="round" paint-order="stroke">UE5 PLUGINS</text></g>
    <text class="sn" x="342" y="246" font-size="12.5" fill="#ece9e4" fill-opacity=".62">Blueprint HTTP nodes and a weighted</text>
    <text class="sn" x="342" y="264" font-size="12.5" fill="#ece9e4" fill-opacity=".62">character spawner for Unreal 5.</text>
    <text class="mn" x="342" y="286" font-size="9" letter-spacing="1.8" fill="#ff2b50">C++ / UNREAL 5</text>
  </g>
  <g class="rise d5">
    <polygon points="620,178 876,178 864,300 608,300" fill="#171717" stroke="#ffffff" stroke-opacity=".16"/>
    <polygon points="620,178 652,178 646,183 614,183" fill="#e4002b"/>
    <g transform="translate(0,220) skewX(-7) translate(0,-220)"><text class="disp" font-size="22" textLength="155.04" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="628" y="222" fill="#e4002b">SENTIMENT CHATBOT</text><text class="disp" font-size="22" textLength="155.04" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="626" y="220" fill="#ffffff" stroke="#050505" stroke-width="4" stroke-linejoin="round" paint-order="stroke">SENTIMENT CHATBOT</text></g>
    <text class="sn" x="626" y="246" font-size="12.5" fill="#ece9e4" fill-opacity=".62">Reads the mood of a conversation</text>
    <text class="sn" x="626" y="264" font-size="12.5" fill="#ece9e4" fill-opacity=".62">while it is happening.</text>
    <text class="mn" x="626" y="286" font-size="9" letter-spacing="1.8" fill="#ff2b50">REACT / FLASK</text>
  </g>
  <g class="rise d6">
    <polygon points="904,178 1160,178 1148,300 892,300" fill="#171717" stroke="#ffffff" stroke-opacity=".16"/>
    <polygon points="904,178 936,178 930,183 898,183" fill="#e4002b"/>
    <g transform="translate(0,220) skewX(-7) translate(0,-220)"><text class="disp" font-size="22" textLength="127.68" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="912" y="222" fill="#e4002b">DUAL-HERO SITE</text><text class="disp" font-size="22" textLength="127.68" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="910" y="220" fill="#ffffff" stroke="#050505" stroke-width="4" stroke-linejoin="round" paint-order="stroke">DUAL-HERO SITE</text></g>
    <text class="sn" x="910" y="246" font-size="12.5" fill="#ece9e4" fill-opacity=".62">A portfolio that switches between</text>
    <text class="sn" x="910" y="264" font-size="12.5" fill="#ece9e4" fill-opacity=".62">two comic-book identities.</text>
    <text class="mn" x="910" y="286" font-size="9" letter-spacing="1.8" fill="#ff2b50">REACT / TAILWIND</text>
  </g>
</svg>
