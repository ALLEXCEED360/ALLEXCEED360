<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 208" width="1200" height="208" role="img" aria-label="Talk to me. Retrieval pipelines, computer vision, Unreal Engine, or why filmmaking makes you a better engineer. If you are building something strange and ambitious, the inbox is open.">
  <defs><linearGradient id="gd" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#0e0e0e"/><stop offset="1" stop-color="#050505"/></linearGradient><linearGradient id="rd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9e0020"/><stop offset="1" stop-color="#e4002b"/></linearGradient><linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="-40" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".92"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1760 0;1760 0" keyTimes="0;.42;1" dur="6.4s" begin="1.1s" repeatCount="indefinite"/></linearGradient><linearGradient id="scanf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e4002b" stop-opacity="0"/><stop offset=".5" stop-color="#ff2b50" stop-opacity=".85"/><stop offset="1" stop-color="#e4002b" stop-opacity="0"/></linearGradient><pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><circle cx="2" cy="2" r="1.5" fill="#e4002b" fill-opacity=".30"/></pattern></defs>
  <style>
    .disp{font-family:Impact,Haettenschweiler,"Franklin Gothic Heavy","Arial Narrow Bold","Arial Black",sans-serif;font-weight:400}
    .hv{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900}
    .sn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mn{font-family:ui-monospace,"IBM Plex Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .rise{animation:rise .85s cubic-bezier(.16,1,.3,1) both}
    .slam{animation:slam .55s cubic-bezier(.2,1.3,.3,1) both}
    .cut{animation:cut .6s cubic-bezier(.2,.9,.1,1) both}
    .d1{animation-delay:.04s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}.d4{animation-delay:.3s}
    .d5{animation-delay:.4s}.d6{animation-delay:.5s}.d7{animation-delay:.6s}.d8{animation-delay:.7s}
    .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.3s cubic-bezier(.65,0,.35,1) .25s forwards}
    .flick{animation:flick 5s steps(1,end) infinite}
    .ember{animation-name:ember;animation-timing-function:ease-out;animation-iteration-count:infinite}
    .scan{animation:scan 9.5s linear infinite}
    .drift{animation:drift 26s ease-in-out infinite}
    .pulse{animation:pulse 3.6s ease-in-out infinite}
    .amb{pointer-events:none}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes slam{from{opacity:0;transform:translate(-34px,0) scale(1.06)}to{opacity:1;transform:none}}
    @keyframes cut{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes flick{0%,92%,96%{opacity:1}94%,98%{opacity:.45}}
    @keyframes ember{0%{opacity:0;transform:translateY(0)}14%{opacity:.75}66%{opacity:.38}100%{opacity:0;transform:translateY(-256px)}}
    @keyframes scan{0%{transform:translateY(-24px);opacity:0}7%{opacity:.5}93%{opacity:.5}100%{transform:translateY(234px);opacity:0}}
    @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .rise,.slam,.cut,.flick,.ember,.scan,.drift,.pulse{animation:none}
      .draw{animation:none;stroke-dashoffset:0}
      .sheen,.amb{display:none}
    }
  </style>
  <rect width="1200" height="208" fill="url(#gd)"/>
  <rect width="1200" height="208" fill="url(#ht)" opacity=".5"/>
  <g class="amb">
    <circle class="ember" cx="664" cy="219" r="2.0" fill="#ff2b50" style="animation-duration:12.5s;animation-delay:-0.6s"/>
    <circle class="ember" cx="209" cy="216" r="2.5" fill="#e4002b" style="animation-duration:8.9s;animation-delay:-0.0s"/>
    <circle class="ember" cx="426" cy="227" r="2.2" fill="#e4002b" style="animation-duration:11.3s;animation-delay:-10.3s"/>
    <circle class="ember" cx="1060" cy="233" r="1.7" fill="#ff2b50" style="animation-duration:9.0s;animation-delay:-1.5s"/>
    <circle class="ember" cx="335" cy="211" r="1.3" fill="#e4002b" style="animation-duration:12.1s;animation-delay:-8.4s"/>
    <circle class="ember" cx="841" cy="214" r="1.9" fill="#e4002b" style="animation-duration:8.1s;animation-delay:-7.4s"/>
    <circle class="ember" cx="512" cy="229" r="2.4" fill="#ff2b50" style="animation-duration:8.4s;animation-delay:-8.5s"/>
    <circle class="ember" cx="46" cy="212" r="2.6" fill="#e4002b" style="animation-duration:7.4s;animation-delay:-1.1s"/>
    <circle class="ember" cx="930" cy="214" r="1.4" fill="#e4002b" style="animation-duration:8.8s;animation-delay:-9.4s"/>
    <circle class="ember" cx="335" cy="218" r="1.7" fill="#ff2b50" style="animation-duration:11.3s;animation-delay:-4.2s"/>
    <circle class="ember" cx="758" cy="216" r="2.3" fill="#e4002b" style="animation-duration:12.0s;animation-delay:-2.8s"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#scanf)"/>
  </g>
  <polygon class="cut d1 drift" points="236,-10 292,-10 196,218 140,218" fill="#e4002b" fill-opacity=".14"/>
  <polygon class="cut d1 drift" points="946,-10 986,-10 890,218 850,218" fill="#e4002b" fill-opacity=".14"/>
  <g class="slam d2"><g transform="translate(0,92) skewX(-9) translate(0,-92)"><text class="disp" font-size="48" textLength="310" lengthAdjust="spacingAndGlyphs" text-anchor="middle" x="604" y="96" fill="#e4002b">TALK TO ME.</text><text class="disp" font-size="48" textLength="310" lengthAdjust="spacingAndGlyphs" text-anchor="middle" x="600" y="92" fill="#ffffff" stroke="#050505" stroke-width="5" stroke-linejoin="round" paint-order="stroke">TALK TO ME.</text><text class="disp sheen" font-size="48" textLength="310" lengthAdjust="spacingAndGlyphs" text-anchor="middle" x="600" y="92" fill="url(#sheen)">TALK TO ME.</text></g></g>
  <text class="sn rise d4" x="600" y="138" font-size="16" text-anchor="middle" fill="#ece9e4" fill-opacity=".88">Retrieval pipelines, computer vision, Unreal Engine, or why filmmaking makes you a better engineer.</text>
  <text class="sn rise d5" x="600" y="166" font-size="16" text-anchor="middle" fill="#ece9e4" fill-opacity=".88">If you&#8217;re building something strange and ambitious, the inbox is open.</text>
  <g class="rise d6"><polygon points="402,186 414,186 410,198 398,198" fill="#e4002b"/><polygon points="786,186 798,186 794,198 782,198" fill="#e4002b"/></g>
  <line class="draw" x1="430" y1="192" x2="770" y2="192" stroke="#ffffff" stroke-opacity=".3"/>
</svg>
