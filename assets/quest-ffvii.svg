<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 262" width="1200" height="262" role="img" aria-label="Quest II. FFVII Timeline Analyzer, live. An interactive analysis of the Final Fantasy VII universe across its major versions, laying every retelling, remake and divergence against the others on one timeline. TypeScript, React, Vercel.">
  <defs><linearGradient id="gd" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#0e0e0e"/><stop offset="1" stop-color="#050505"/></linearGradient><linearGradient id="rd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9e0020"/><stop offset="1" stop-color="#e4002b"/></linearGradient><pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><circle cx="2" cy="2" r="1.5" fill="#e4002b" fill-opacity=".30"/></pattern></defs>
  <style>
    .disp{font-family:Impact,Haettenschweiler,"Franklin Gothic Heavy","Arial Narrow Bold","Arial Black",sans-serif;font-weight:400}
    .hv{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900}
    .sn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
    .mn{font-family:ui-monospace,"IBM Plex Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .rise{animation:rise .85s cubic-bezier(.16,1,.3,1) both}
    .slam{animation:slam .55s cubic-bezier(.2,1.3,.3,1) both}
    .cut{animation:cut .6s cubic-bezier(.2,.9,.1,1) both}
    .d1{animation-delay:.04s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}.d4{animation-delay:.3s}
    .d5{animation-delay:.4s}.d6{animation-delay:.5s}.d7{animation-delay:.6s}.d8{animation-delay:.7s}
    .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.3s cubic-bezier(.65,0,.35,1) .25s forwards}
    .flick{animation:flick 5s steps(1,end) infinite}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes slam{from{opacity:0;transform:translate(-34px,0) scale(1.06)}to{opacity:1;transform:none}}
    @keyframes cut{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes flick{0%,92%,96%{opacity:1}94%,98%{opacity:.45}}
    @media (prefers-reduced-motion:reduce){
      .rise,.slam,.cut,.flick{animation:none}
      .draw{animation:none;stroke-dashoffset:0}
    }
  </style>
  <rect width="1200" height="262" fill="url(#gd)"/>
  <rect width="1200" height="262" fill="url(#ht)" opacity=".5"/>
  <polygon points="24,0 1200,0 1200,238 1176,262 0,262 0,24" fill="#0e0e0e" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5"/>
  <polygon points="2,30 14,22 14,240 2,250" fill="#e4002b"/>
  <g transform="translate(0,232) skewX(-9) translate(0,-232)"><text class="disp" font-size="182" textLength="132" lengthAdjust="spacingAndGlyphs" text-anchor="end" fill-opacity=".05" x="1164" y="232" fill="#ffffff">II</text></g>
  <g class="rise d1">
    <polygon points="38.0,31.5 55.7,29.7 81.8,29.5 101.2,26.7 115.1,27.3 132.1,29.8 154.3,26.3 166.0,25.8 166.0,59.0 143.7,57.6 117.0,55.1 91.0,56.8 77.5,53.0 56.5,55.9 38.0,59.0" fill="#e4002b"/>
    <text class="hv" x="52" y="48" font-size="11.5" letter-spacing="3.6" fill="#ffffff">QUEST II</text>
    <g><polygon points="1108.84,28 1158,28 1149,53 1099.84,53" fill="#9e0020"/><text class="hv" x="1128.92" y="45" font-size="10.5" letter-spacing="1.8" text-anchor="middle" fill="#ffffff">LIVE</text></g>
  </g>
  <g class="slam d2"><g transform="translate(0,112) skewX(-9) translate(0,-112)"><text class="disp" font-size="46" textLength="322" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="43" y="115" fill="#e4002b">FFVII TIMELINE</text><text class="disp" font-size="46" textLength="322" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="40" y="112" fill="#ffffff" stroke="#050505" stroke-width="5" stroke-linejoin="round" paint-order="stroke">FFVII TIMELINE</text></g></g>
  <text class="sn rise d3" x="388" y="112" font-size="15" font-style="italic" fill="#ece9e4" fill-opacity=".55">INTERACTIVE NARRATIVE ANALYSIS</text>
  <line class="draw" x1="40" y1="132" x2="1158" y2="132" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.5"/>
  <text class="sn rise d4" x="40" y="160" font-size="16" fill="#ece9e4" fill-opacity=".9">An interactive analysis of the Final Fantasy VII universe across its major versions. Every</text>
  <text class="sn rise d5" x="40" y="185" font-size="16" fill="#ece9e4" fill-opacity=".9">retelling, remake and divergence laid against the others on one timeline.</text>
  <text class="mn rise d6" x="40" y="208" font-size="10.5" letter-spacing="2.2" fill="#ff2b50">CROSS-VERSION CANON  /  INTERACTIVE TIMELINE  /  DEPLOYED</text>
  <g class="rise d7"><g><polygon points="44,222 128.55,222 124.55,245 40,245" fill="#171717" stroke="#ffffff" stroke-opacity=".5"/><text class="mn" x="51" y="237.5" font-size="11" letter-spacing=".5" fill="#ece9e4">TypeScript</text></g><g><polygon points="141.55,222 192.825,222 188.825,245 137.55,245" fill="#171717" stroke="#ffffff" stroke-opacity=".5"/><text class="mn" x="148.55" y="237.5" font-size="11" letter-spacing=".5" fill="#ece9e4">React</text></g><g><polygon points="205.825,222 263.755,222 259.755,245 201.825,245" fill="#171717" stroke="#ffffff" stroke-opacity=".5"/><text class="mn" x="212.825" y="237.5" font-size="11" letter-spacing=".5" fill="#ece9e4">Vercel</text></g></g>
</svg>
