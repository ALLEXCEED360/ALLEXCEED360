  <g class="slam d2"><g transform="translate(0,132) skewX(-9) translate(0,-132)"><text class="disp" font-size="40" textLength="374" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="47" y="135" fill="#e4002b">BUILDING SYSTEMS.</text><text class="disp" font-size="40" textLength="374" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="44" y="132" fill="#ffffff" stroke="#050505" stroke-width="5" stroke-linejoin="round" paint-order="stroke">BUILDING SYSTEMS.</text><text class="disp sheen" font-size="40" textLength="374" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="44" y="132" fill="url(#sheen)">BUILDING SYSTEMS.</text></g></g>
  <g class="slam d3"><g transform="translate(0,184) skewX(-9) translate(0,-184)"><text class="disp" font-size="40" textLength="350" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="47" y="187" fill="#e4002b">CREATING WORLDS.</text><text class="disp" font-size="40" textLength="350" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="44" y="184" fill="#ffffff" stroke="#050505" stroke-width="5" stroke-linejoin="round" paint-order="stroke">CREATING WORLDS.</text><text class="disp sheen" font-size="40" textLength="350" lengthAdjust="spacingAndGlyphs" text-anchor="start" x="44" y="184" fill="url(#sheen)">CREATING WORLDS.</text></g></g>
  <g class="rise d4">
    <polygon points="46,220 52,220 46,258 40,258" fill="#e4002b"/>
