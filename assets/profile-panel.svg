    <text class="sn" x="62" y="308" font-size="14.5" fill="#ece9e4" fill-opacity=".88">Game Developer, Dragon Drop LLC</text>
  </g>
  <g class="rise d6">
    <polygon points="46,328 52,328 46,366 40,366" fill="#e4002b"/>
    <text class="mn" x="62" y="340" font-size="10" letter-spacing="3" fill="#ff2b50">PEOPLE &amp; OPS</text>
    <text class="sn" x="62" y="362" font-size="14.5" fill="#ece9e4" fill-opacity=".88">HR Assistant, Imprint Resources &amp; Management LLC</text>
  </g>
  <polygon points="470,48 476,48 458,386 452,386" fill="#e4002b" fill-opacity=".45"/>
  <text class="sn rise d2" x="518" y="76" font-size="15.5" fill="#ece9e4" fill-opacity=".9">I&#x27;m a Computer Science graduate from BRAC University working across software</text>
  <text class="sn rise d3" x="518" y="101" font-size="15.5" fill="#ece9e4" fill-opacity=".9">engineering, game development, and visual storytelling. Currently developing</text>
  <text class="sn rise d4" x="518" y="126" font-size="15.5" fill="#ece9e4" fill-opacity=".9">games at Dragon Drop LLC and supporting people and operations as an HR</text>
  <text class="sn rise d5" x="518" y="151" font-size="15.5" fill="#ece9e4" fill-opacity=".9">Assistant at Imprint Resources &amp; Management LLC.</text>
  <text class="sn rise d7" x="518" y="201" font-size="15.5" fill="#ece9e4" fill-opacity=".9">I like turning ideas into things people can actually use, play, or experience.</text>
  <text class="sn rise d8" x="518" y="226" font-size="15.5" fill="#ece9e4" fill-opacity=".9">That means engineering reliable systems, building interactive worlds, and</text>
  <text class="sn rise d8" x="518" y="251" font-size="15.5" fill="#ece9e4" fill-opacity=".9">finding the details that make a project feel complete.</text>
  <text class="sn rise d8" x="518" y="301" font-size="15.5" fill="#ece9e4" fill-opacity=".9">From tracing a story across the Final Fantasy VII timeline to bringing a game</text>
  <text class="sn rise d8" x="518" y="326" font-size="15.5" fill="#ece9e4" fill-opacity=".9">to life, I enjoy the challenge of connecting technical precision with creative</text>
  <text class="sn rise d8" x="518" y="351" font-size="15.5" fill="#ece9e4" fill-opacity=".9">vision.</text>
