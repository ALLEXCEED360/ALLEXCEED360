  <g class="rise d2">
    <g transform="translate(0,150) skewX(-9) translate(0,-150)"><text class="disp" font-size="56" textLength="118" lengthAdjust="spacingAndGlyphs" text-anchor="middle" x="1016" y="154" fill="#e4002b">PLAY</text><text class="disp" font-size="56" textLength="118" lengthAdjust="spacingAndGlyphs" text-anchor="middle" x="1012" y="150" fill="#ffffff" stroke="#050505" stroke-width="5" stroke-linejoin="round" paint-order="stroke">PLAY</text><text class="disp sheen" font-size="56" textLength="118" lengthAdjust="spacingAndGlyphs" text-anchor="middle" x="1012" y="150" fill="url(#sheen)">PLAY</text></g>
