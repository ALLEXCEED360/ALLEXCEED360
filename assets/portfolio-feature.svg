    <circle class="ember" cx="692" cy="342" r="2.1" fill="#e4002b" style="animation-duration:9.3s;animation-delay:-4.4s"/>
    <circle class="ember" cx="60" cy="348" r="2.2" fill="#e4002b" style="animation-duration:9.8s;animation-delay:-2.8s"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#scanf)"/>
  </g>
