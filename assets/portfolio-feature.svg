    <circle class="ember" cx="806" cy="352" r="2.5" fill="#e4002b" style="animation-duration:11.5s;animation-delay:-7.7s"/>
    <circle class="ember" cx="965" cy="355" r="1.3" fill="#ff2b50" style="animation-duration:10.1s;animation-delay:-1.8s"/>
    <circle class="ember" cx="404" cy="346" r="1.4" fill="#e4002b" style="animation-duration:11.6s;animation-delay:-1.0s"/>
