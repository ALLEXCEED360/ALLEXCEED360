    <polygon points="1133.4,180.2 1090.4,191.9 1119.5,225.7 1075.3,220.1 1089.2,262.4 1050.5,240.4 1047.2,284.8 1019.9,249.6 999.8,289.4 988.1,246.4 954.3,275.5 959.9,231.3 917.6,245.2 939.6,206.5 895.2,203.2 930.4,175.9 890.6,155.8 933.6,144.1 904.5,110.3 948.7,115.9 934.8,73.6 973.5,95.6 976.8,51.2 1004.1,86.4 1024.2,46.6 1035.9,89.6 1069.7,60.5 1064.1,104.7 1106.4,90.8 1084.4,129.5 1128.8,132.8 1093.6,160.1" fill="#050505"/>
